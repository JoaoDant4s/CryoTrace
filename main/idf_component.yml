dependencies:
  idf:
    version: '>=5.0'
  # MQTT client (no longer bundled with ESP-IDF since v6)
  espressif/mqtt:
    version: ^1.1.0
  # Cellular link only (menuconfig > CryoTrace - Network > Network link)
  espressif/esp_modem:
    version: ^1.4.0
    rules:
      - if: "$CONFIG{CRYO_NET_CELLULAR} == True"
